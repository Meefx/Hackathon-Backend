services:
  trust-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: graceline_trust
      POSTGRES_USER: graceline
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - trust-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graceline -d graceline_trust"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  trust-data:
