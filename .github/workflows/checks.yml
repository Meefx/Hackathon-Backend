name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: collectflow_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: collectflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collectflow_test -d collectflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://collectflow_test:local-test-password@127.0.0.1:5432/collectflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q
