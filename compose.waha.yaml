name: collectflow-waha-local

services:
  waha:
    image: devlikeapro/waha:latest-2026.10.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAHA_PORT:-3002}:3000"
    env_file:
      - .env.waha.local
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?Run scripts/waha-local.sh init}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Run scripts/waha-local.sh init}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:?Run scripts/waha-local.sh init}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Run scripts/waha-local.sh init}
      WAHA_DASHBOARD_ENABLED: "true"
      WHATSAPP_SWAGGER_ENABLED: "true"
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: warn
      WAHA_HTTP_LOG_LEVEL: warn
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch('http://127.0.0.1:3000/health', {
            headers: {'X-Api-Key': process.env.WAHA_API_KEY},
            signal: AbortSignal.timeout(3000),
          }).then(response => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  waha_sessions:
