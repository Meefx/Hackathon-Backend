name: collectflow

x-backend: &backend
  build: .
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-collectflow}:${POSTGRES_PASSWORD:-local-demo-password}@postgres:5432/${POSTGRES_DB:-collectflow}
    APP_NAME: ${APP_NAME:-CollectFlow API}
    DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
    DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-2000}
    APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
    SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    SCHEDULER_START_HOUR: ${SCHEDULER_START_HOUR:-9}
    SCHEDULER_RUNTIME_MODE: ${SCHEDULER_RUNTIME_MODE:-simulated}
    WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    WORKER_RUNTIME_DEADLINE_SECONDS: ${WORKER_RUNTIME_DEADLINE_SECONDS:-300}
    DEMO_FIXTURE_ENABLED: ${DEMO_FIXTURE_ENABLED:-true}
    KNOWLEDGE_MODE: ${KNOWLEDGE_MODE:-demo_fixture}
    KNOWLEDGE_SERVICE_FACTORY: ${KNOWLEDGE_SERVICE_FACTORY:-}
    APPROVAL_HMAC_SECRET: ${APPROVAL_HMAC_SECRET:-local-synthetic-demo-change-before-sharing}
    HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
    HERMES_API_KEY: ${HERMES_API_KEY:-}
    HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-20}
    HERMES_PROFILE: ${HERMES_PROFILE:-}
    GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
    GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
    GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
    GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
    GMAIL_TEST_RECIPIENT: ${GMAIL_TEST_RECIPIENT:-}
    GMAIL_TIMEOUT_SECONDS: ${GMAIL_TIMEOUT_SECONDS:-10}
    MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
    MCP_PRINCIPAL_ID: ${MCP_PRINCIPAL_ID:-hermes-agent}
    MCP_ALLOWED_HOSTS: '${MCP_ALLOWED_HOSTS:-["127.0.0.1:*","localhost:*"]}'
    MCP_ALLOWED_ORIGINS: '${MCP_ALLOWED_ORIGINS:-["http://127.0.0.1:*","http://localhost:*"]}'
    TRUST_ENABLED: ${TRUST_ENABLED:-false}
    TRUST_JWT_SECRET: ${TRUST_JWT_SECRET:-}
    TRUST_APPROVAL_SECRET: ${TRUST_APPROVAL_SECRET:-}
    TRUST_DEMO_AUTH_ENABLED: "false"
    SIMULATION_MODE: "true"
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collectflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_DB: ${POSTGRES_DB:-collectflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10

  worker:
    <<: *backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.collection"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mcp:
    <<: *backend
    profiles: ["mcp"]
    command: ["uv", "run", "--no-sync", "uvicorn", "app.mcp.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      # MCP needs the same DB but uses its own listener, never the operator REST router.
      DATABASE_URL: postgresql://${POSTGRES_USER:-collectflow}:${POSTGRES_PASSWORD:-local-demo-password}@postgres:5432/${POSTGRES_DB:-collectflow}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-2000}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_PRINCIPAL_ID: ${MCP_PRINCIPAL_ID:-hermes-agent}
      MCP_TOKEN_EXPIRES_AT: ${MCP_TOKEN_EXPIRES_AT:-2000-01-01T00:00:00Z}
      MCP_ALLOWED_HOSTS: '${MCP_ALLOWED_HOSTS:-["127.0.0.1:*","localhost:*"]}'
      MCP_ALLOWED_ORIGINS: '${MCP_ALLOWED_ORIGINS:-["http://127.0.0.1:*","http://localhost:*"]}'
      KNOWLEDGE_MODE: ${KNOWLEDGE_MODE:-demo_fixture}
      KNOWLEDGE_SERVICE_FACTORY: ${KNOWLEDGE_SERVICE_FACTORY:-}
      APPROVAL_HMAC_SECRET: ${APPROVAL_HMAC_SECRET:-local-synthetic-demo-change-before-sharing}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres-test:
    image: pgvector/pgvector:pg17
    profiles: ["test"]
    environment:
      POSTGRES_USER: collectflow_test
      POSTGRES_PASSWORD: local-test-password
      POSTGRES_DB: collectflow_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectflow_test -d collectflow_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
